# Root west.yml - manages Zephyr and dependencies
manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: my-modules
      url-base: https://github.com/your-org

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.2.0  # Pin to specific version for stability
      import: true
    
    # Optional: Add custom modules
    # - name: my-sensor-drivers
    #   remote: my-modules
    #   revision: main
    #   path: modules/sensors

  self:
    path: .