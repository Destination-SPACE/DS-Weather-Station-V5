# Simple BME280 sensor test - USB serial output only

# Sensor support
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BME280=y

# Console output via USB serial
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Basic logging
CONFIG_LOG=y
CONFIG_PRINTK=y

# Math functions (use newlib instead of LIBM)
CONFIG_NEWLIB_LIBC=y